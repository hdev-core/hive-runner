name: Contest indexer

on:
  schedule:
    # Asked for every 15 minutes, but GitHub runs scheduled workflows best-effort: in practice
    # this repo saw a run every 3-9 hours, averaging 5.5 - roughly a 20x shortfall.
    #
    # Deliberately OFF the quarter hour. Almost every cron on GitHub is written */15 or */5,
    # so :00 :15 :30 :45 are the most contended slots on the platform and a low-activity free
    # repo queues behind everything else. Odd minutes dodge the crush. This is a mitigation,
    # not a fix - scheduled events are best-effort by design.
    #
    # For a dependable cadence, trigger workflow_dispatch from an external cron instead
    # (see docs/operations.md). workflow_dispatch is user-initiated and is not throttled
    # the same way.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Indexer tests
        run: node --test indexer/index.test.mjs
      - name: Stream chain and aggregate scores
        run: node indexer/index.mjs
      - name: Commit updated leaderboard
        run: |
          git config user.name "hive-runner-bot"
          git config user.email "hive-runner-bot@users.noreply.github.com"
          git add data/leaderboard.json indexer/state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(indexer): update leaderboard [skip ci]"
            # main may have moved while we were scanning (a human push): rebase and retry
            for attempt in 1 2 3; do
              if git pull --rebase --quiet && git push; then exit 0; fi
              sleep 5
            done
            echo "could not push the leaderboard after 3 attempts" && exit 1
          fi
